# ---------------------------------------------------------------------------
# CWLog Utils 設定サンプル
#
# このファイルを cwlog.conf にコピーすると自動で読み込まれます。
#   探索順: カレントディレクトリ -> スクリプト配置元 -> ~/.config/cwlog -> ~
#   明示指定する場合は --config <PATH>
#
# 優先順位: デフォルト < この設定ファイル < 環境変数 < コマンドライン引数
#
# 本ファイルは bash として source されます。変数代入・配列・コマンド置換
# ($HOME など) がそのまま使えます。値を変えない項目は削除して構いません。
# ---------------------------------------------------------------------------

# --- AWS 接続 ---------------------------------------------------------------
# 対象アカウント環境の AWS プロファイル (空なら既定の資格情報)
aws_profile=""
aws_region="ap-northeast-1"

# --- 事前認証チェック -------------------------------------------------------
# 未認証のときに画面へ案内するログインコマンド
auth_login_command="aws login --remote"
auth_timeout=15
# 1 にすると認証チェックを行わない (非推奨)
auth_skip=0

# --- 権限不足時のスイッチバック ---------------------------------------------
# off  : 権限チェックを行わない
# warn : 権限不足なら警告メッセージを出して終了する (既定)
# auto : 権限不足なら下記シェルを source して自動的にスイッチバックする
switchback_mode="warn"

# 別チームが用意しているスイッチバック専用シェル (source で呼び出す)
# 例) /opt/team/aws/switch_role.sh  や  $HOME/tools/aws-switchback.sh
switchback_script=""

# source 時に渡す追加引数
switchback_args=()

# 1 にすると別プロセスのシェルで source し、AWS_* 環境変数だけを取り込む
# (source 先が exit や set -e を行う場合の保険。既定はこのシェルで直接 source)
switchback_isolated=0
# isolated 実行時に source を行うシェル
switchback_shell="bash"
switchback_timeout=120

# 自動スイッチバック後に権限確認をリトライする回数
switchback_retry=1

# 現在のロールが CodeCommit 用ロールかを判定する正規表現 (メッセージ補助用)
switchback_codecommit_role_pattern="codecommit"

# --- ロググループ一覧 -------------------------------------------------------
groups_max_items=500
# --filter を常に正規表現として扱う場合は 1
groups_regex=0

# --- ログ取得 ---------------------------------------------------------------
# filter   : FilterLogEvents (ログストリームを介さず横断取得。既定)
# insights : CloudWatch Logs Insights (サーバ側で降順ソート)
events_engine="filter"
events_limit=1000
events_hours=24
# 時系列の並び順: asc = 昇順 (古い順, 既定) / desc = 降順 (新しい順)
events_order="asc"

# 1 にすると最新のログストリーム 1 本だけを対象にする (既定)
# 0 にするとロググループ内の全ログストリームを横断して取得する
# ※ --start / --end で期間を指定した場合は、1 でも全ストリームを横断する
#    (期間指定時に 1 本へ絞るにはコマンドラインで --latest-stream を明示する)
events_latest_stream=1

# 最新ログストリームを探すときに DescribeLogStreams で走査する最大本数
# (LastEventTime の降順に走査し、指定期間と重なる最初の 1 本を採用する)
events_stream_scan_limit=50

events_chunk_max_seconds=21600
events_max_chunks=240
events_timezone="Asia/Tokyo"

# --- カラーリング判定 -------------------------------------------------------
# 正規表現は gawk の拡張 ERE。大文字小文字は区別しません。
#   \y          単語境界 (Perl の \b に相当。gawk では \b は使えません)
#   [[:alnum:]] 英数字     [[:space:]] 空白
colors_enabled=1

# 該当した行をエラー扱いにする
colors_error_patterns=(
    '\y(ERROR|ERR|FATAL|CRITICAL|CRIT|SEVERE|PANIC|EMERG|ALERT)\y'
    '\y(Exception|Traceback|StackTrace|Stack trace)\y'
    '^[[:space:]]*Caused by:'
    '\y(AccessDenied|Unauthorized|Forbidden|Timeout|TimedOut)\y'
    '(エラー|失敗しました|異常終了|致命的)'
)

# 該当した行を警告扱いにする
colors_warn_patterns=(
    '\y(WARN|WARNING|CAUTION|NOTICE|DEPRECATED)\y'
    '\y(retry|retrying|fallback|throttl[[:alnum:]_]*)\y'
    '(警告|注意|リトライ)'
)

# 誤検知を避けたい表現 (errors=0 / "warnings": [] など)。判定前にマスクします。
colors_exclude_patterns=(
    '\yerrors?[[:space:]]*[=:][[:space:]]*(0|null|""|\[\]|false|none)\y'
    '\ywarn(ing)?s?[[:space:]]*[=:][[:space:]]*(0|null|\[\]|false|none)\y'
)

colors_error_color="bright_red"
colors_warn_color="bright_yellow"
colors_info_color="default"

# --- 出力 -------------------------------------------------------------------
export_dir="./output"
# テキスト出力にも ANSI カラーを埋め込む (less -R 等で色付き表示)
export_text_ansi=0
# Excel の行塗り分け色 (ARGB)
export_excel_error_fill="FFF4CCCC"
export_excel_warn_fill="FFFFF2CC"
export_excel_info_fill="FFFFFFFF"
export_excel_header_fill="FF305496"
